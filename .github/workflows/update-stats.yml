name: Update GitHub Stats

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch: {} # allow manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate stats
        env:
          # PAT with `repo` + `read:user` scopes -> includes PRIVATE contributions.
          # Required on purpose: if the secret is missing, generate.mjs exits
          # non-zero (no commit) instead of publishing public-only numbers that
          # would under-count activity and drop the repo count from 7 to 1.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: malzinger
        run: node generate.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "Friedrich Malz"
          git config user.email "107999642+malzinger@users.noreply.github.com"
          git add stats.json card.svg
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "Update stats - $(date -u +%Y-%m-%d)"
            git push
          fi
